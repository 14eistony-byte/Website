services:
  - type: web
    name: cdb-baeumlis-portal
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /health
    envVars:
      - key: WEBSITE_URL
        value: https://website-dvaj.onrender.com
      - key: DISCORD_CLIENT_ID
        value: "1556687990963576962"
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_REDIRECT_URI
        value: https://website-dvaj.onrender.com/auth/callback
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: GUILD_ID
        sync: false
      - key: RULES_ACCEPTED_ROLE_ID
        sync: false
      - key: APPLICATION_CHANNEL_ID
        value: "1558576631814299759"
